name: Telegram autopost

on:
  schedule:
    - cron: "0 12 */3 * *"   # раз в 3 дня, 12:00 UTC
  workflow_dispatch: {}       # кнопка "Run workflow" для ручного теста

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Post next item from queue
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python3 bot/post_next.py

      - name: Save queue state
        run: |
          git config user.name "anchorvault-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/posts.json
          git diff --quiet --cached || git commit -m "bot: mark post as published"
          git push
