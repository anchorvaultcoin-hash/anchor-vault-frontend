name: Collect news candidates

on:
  schedule:
    - cron: "0 6 * * *"      # каждый день в 06:00 UTC
  workflow_dispatch: {}       # кнопка "Run workflow" для ручного запуска

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect candidates from RSS
        run: python3 bot/fetch_news.py

      - name: Save candidates
        run: |
          git config user.name "anchorvault-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/drafts.json
          git diff --quiet --cached || git commit -m "bot: collect news candidates"
          git push
